<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Картинка-заглушка: показывается, если у новости не указано фото.
       Можно заменить на свою — оставьте то же имя файла (placeholder.svg)
       или поменяйте путь в js/config.js (поле defaultImage). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ececea"/>
      <stop offset="1" stop-color="#d8d8d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#g)"/>
  <g fill="none" stroke="#a5a5a0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <rect x="300" y="170" width="200" height="160" rx="14"/>
    <circle cx="350" cy="220" r="14"/>
    <path d="M300 300 L370 250 L420 290 L460 260 L500 300"/>
  </g>
</svg>
