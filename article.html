<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Заголовок вкладки здесь меняется автоматически на название новости -->
  <title>Новость</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📰%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="site-header"></div>

  <!-- ВАЖНО: эту страницу редактировать НЕ нужно.
       Она одна показывает ВСЕ новости. Какую именно — определяет адрес:
       article.html?id=moya-novost
       Тексты новостей добавляются в файле js/articles.js -->
  <main class="container narrow">
    <div id="article"></div>

    <section id="more-section" hidden>
      <h2 class="section-title">Читайте также</h2>
      <div id="more" class="grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/articles.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
